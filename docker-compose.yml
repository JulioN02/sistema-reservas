services:
  db:
    image: postgres:16-alpine
    container_name: sistema-reservas-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sistema_reservas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistema_reservas"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-test:
    image: postgres:16-alpine
    container_name: sistema-reservas-db-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sistema_reservas_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistema_reservas_test"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: