# Nginx del contenedor web (imagen nginx-unprivileged → escucha en 8080, no-root).
#
#  - SPA fallback: cualquier ruta desconocida sirve index.html (React Router).
#  - Proxy opcional a la API (`/api/` → servicio `api:3000`): permite servir la
#    SPA y el API en el MISMO origen en el compose local, de modo que la cookie
#    de sesión viaja sin CORS. En Railway (orígenes separados) el bundle se
#    construye con VITE_API_URL apuntando al dominio del API y este proxy queda
#    sin uso.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Assets con hash de Vite: cacheables agresivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy a la API (compose local). `proxy_pass` sin path conserva el URI
    # original (`/api/v1/...` → `http://api:3000/api/v1/...`).
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
